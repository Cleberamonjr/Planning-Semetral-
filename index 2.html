<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#10151C" />
<title>Diário de Evolução · Clebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --void:#10151C; --panel:#171E28; --panel2:#1B2430; --line:#263241;
    --ink:#E6EDF3; --muted:#8A9BB0; --faint:#5C6B7E;
    --signal:#4FA9E0; --pass:#56C596; --gold:#E0A64B;
    --display:'Space Grotesk',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--void);color:var(--ink);font-family:var(--body);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 500px at 85% -10%, rgba(79,169,224,.08), transparent 60%),
      radial-gradient(700px 400px at -5% 5%, rgba(224,166,75,.05), transparent 55%);
    padding-bottom:60px;
  }
  a{color:var(--signal);text-decoration:none;} a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px;}

  header{position:sticky;top:0;z-index:30;background:rgba(16,21,28,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .hin{max-width:900px;margin:0 auto;padding:12px 16px 0;}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand h1{font-family:var(--display);font-weight:700;font-size:clamp(17px,3.4vw,22px);letter-spacing:-.02em;margin:0;}
  .brand .tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;}
  .statusrow{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;}
  .build{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .build b{color:var(--signal);}
  .bar{flex:1;min-width:120px;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal),var(--pass));transition:width .5s cubic-bezier(.2,.7,.2,1);}
  .tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  button.act,.pill{font-family:var(--mono);font-size:11px;letter-spacing:.02em;background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:7px;cursor:pointer;transition:.16s;}
  button.act:hover{color:var(--ink);border-color:var(--signal);}
  button.act.danger:hover{color:#f0a5a5;border-color:#7a3b3b;}
  .pill{cursor:default;}
  .pill.local{color:var(--faint);}
  .pill.ok{color:var(--pass);border-color:rgba(86,197,150,.4);}
  .pill.sync{color:var(--gold);}
  .pill.err{color:#f0a5a5;border-color:#7a3b3b;}

  nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  nav button{flex:0 0 auto;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap;}
  nav button.on{color:var(--ink);border-bottom-color:var(--signal);}

  main{max-width:900px;margin:0 auto;padding:20px 16px 40px;}
  .tab{display:none;} .tab.on{display:block;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .lead{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .lead b{color:var(--ink);}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden;}
  .card.cert{border-color:rgba(224,166,75,.35);background:linear-gradient(180deg,rgba(224,166,75,.05),var(--panel));}
  .chead{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;cursor:pointer;user-select:none;}
  .ctitle{font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.01em;margin:0;flex:1;}
  .cmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-family:var(--mono);font-size:11px;color:var(--faint);}
  .cmeta .pc{color:var(--signal);} .card.cert .cmeta .pc{color:var(--gold);}
  .chev{color:var(--faint);transition:transform .25s;margin-top:2px;}
  .card.col .chev{transform:rotate(-90deg);} .card.col .cbody{display:none;}
  .cbody{padding:0 15px 12px;}

  .task{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--line);}
  .task:first-child{border-top:none;}
  .cbx{flex-shrink:0;margin-top:1px;width:20px;height:20px;border:1.5px solid var(--faint);border-radius:6px;background:none;cursor:pointer;display:grid;place-items:center;transition:.15s;padding:0;}
  .cbx:hover{border-color:var(--signal);}
  .cbx svg{opacity:0;transform:scale(.5);transition:.18s;}
  .task.done .cbx{background:var(--pass);border-color:var(--pass);}
  .task.done .cbx svg{opacity:1;transform:scale(1);}
  .tt{font-size:14px;} .task.done .tt{color:var(--faint);text-decoration:line-through;}
  .tsub{margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .tcat{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;}
  .tlink{font-family:var(--mono);font-size:11.5px;} .tlink .d{color:var(--faint);}
  .tnote{font-size:12px;color:var(--muted);margin-top:3px;}
  .tproj{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(224,166,75,.35);border-radius:5px;padding:1px 6px;margin-top:5px;}

  .kr{padding:9px 0;border-top:1px solid var(--line);}
  .kr:first-child{border-top:none;}
  .krtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .krd{font-size:13.5px;} .krv{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .krbar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px;}
  .krbar>i{display:block;height:100%;background:var(--gold);transition:width .4s;}
  .krctl{display:flex;gap:6px;margin-top:7px;align-items:center;}
  .krctl button{font-family:var(--mono);font-size:12px;width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;}
  .krctl button:hover{color:var(--ink);border-color:var(--gold);}

  .today{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:16px;}
  .today h3{font-family:var(--display);margin:0 0 4px;font-size:16px;}
  .rowitem{display:flex;gap:9px;padding:7px 0;font-size:13.5px;color:var(--ink);}
  .rowitem .k{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 96px;}
  .addbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
  .addbar input,.addbar select{font-family:var(--body);font-size:13px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;}
  .addbar input.desc{flex:1;min-width:150px;}
  .addbar button{font-family:var(--body);font-weight:500;font-size:13px;background:var(--signal);color:#08131c;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;}
  .ev{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .ev .del{font-family:var(--mono);font-size:11px;color:var(--faint);background:none;border:none;cursor:pointer;}
  .ev .del:hover{color:#f0a5a5;}

  .pl{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;flex-wrap:wrap;}
  .pl .nm{flex:0 0 130px;color:var(--muted);}
  .pl .b{flex:1;min-width:120px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;}
  .pl .b>i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--pass));transition:width .4s;}
  .pl .v{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:44px;text-align:right;}

  footer{max-width:900px;margin:0 auto;padding:10px 16px 50px;color:var(--faint);font-size:12px;line-height:1.7;}
  footer code{font-family:var(--mono);color:var(--muted);background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:11px;}
  .warn{display:none;max-width:900px;margin:8px auto 0;padding:8px 14px;font-size:12px;color:#f0c98a;background:rgba(224,166,75,.08);border:1px solid rgba(224,166,75,.3);border-radius:8px;}
  input[type=file]{display:none;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

  ts:[{id:"pCa",t:"Passar na prova (Azure AI Engineer ou AWS)",u:"",note:"Cert te dá a entrevista; os projetos te dão o emprego."}]},
 {id:"c1",code:"BI",title:"Certificar o que já sei — PL-300",est:"3–4 sem",cert:1,
  ts:[{id:"c1a",t:"Microsoft Learn — trilha PL-300 (Power BI)",u:"https://learn.microsoft.com/credentials/certifications/",note:"Seu MBA já cobre a base; aqui é o crachá que o mercado filtra."},{id:"c1b",t:"Fazer a prova PL-300",u:"",proj:1},{id:"c1c",t:"Alternativa: Google Data Analytics",u:"https://www.coursera.org/professional-certificates/google-data-analytics"}]}
];

/* ---------------------------- estado + storage ---------------------------- */
const LKEY="diario-evolucao-v1";
let storageOk=true;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}catch(e){storageOk=false;}
let mem={};
const syncOn = !!(SUPABASE_URL && SUPABASE_ANON);

function loadLocal(){ if(!storageOk)return{}; try{const r=localStorage.getItem(LKEY);return r?JSON.parse(r):{};}catch(e){return{};} }
function saveLocal(s){ if(!storageOk){mem=s;return;} try{localStorage.setItem(LKEY,JSON.stringify(s));}catch(e){mem=s;} }

let state=Object.assign({done:{},kr:{},events:[],col:{}}, storageOk?loadLocal():mem);
state.done=state.done||{}; state.kr=state.kr||{}; state.events=state.events||[]; state.col=state.col||{};

function setSync(mode){
  const p=document.getElementById("syncpill");
  p.className="pill "+mode;
  p.textContent={local:"◇ local",ok:"☁ sincronizado",sync:"⟳ sincronizando…",err:"⚠ erro de sync"}[mode];
}
let debTimer;
function persist(){
  saveLocal(state); updateHeader();
  if(syncOn){ clearTimeout(debTimer); debTimer=setTimeout(pushRemote,700); }
}
async function pushRemote(){
  if(!syncOn)return; setSync("sync");
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?on_conflict=id`,{
      method:"POST",
      headers:{apikey:SUPABASE_ANON,Authorization:"Bearer "+SUPABASE_ANON,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify([{id:ROW_ID,dados:state,updated_at:new Date().toISOString()}])
    });
    if(!r.ok)throw new Error(r.status); setSync("ok");
  }catch(e){ setSync("err"); }
}
async function pullRemote(){
  if(!syncOn)return null; setSync("sync");
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(ROW_ID)}&select=dados`,{
      headers:{apikey:SUPABASE_ANON,Authorization:"Bearer "+SUPABASE_ANON}
    });
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json(); setSync("ok");
    return rows.length?rows[0].dados:null;
  }catch(e){ setSync("err"); return null; }
}

/* ------------------------------- helpers ------------------------------- */
const $=s=>document.querySelector(s);
function domain(u){try{return new URL(u).hostname.replace("www.","");}catch(e){return u;}}
function pctKR(kr){const v=state.kr[kr.id]||0;return kr.meta<=0?0:Math.min(100,Math.round(v*100/kr.meta));}
function pctMesOkr(m){if(!m.krs.length)return 0;let s=0;m.krs.forEach(k=>s+=pctKR(k));return Math.round(s/m.krs.length);}
function tasksMes(m){return m.tf.map(x=>x[0]).concat(state.events.filter(e=>e.date&&e.date.slice(0,7)===m.ym).map(e=>e.id));}
function doneMes(m){return tasksMes(m).filter(id=>state.done[id]).length;}
function bar(p){return `<span class="pl"><span class="b"><i style="width:${p}%"></i></span></span>`;}

function allTaskIds(){
  let ids=[]; MESES.forEach(m=>m.tf.forEach(x=>ids.push(x[0]))); TRILHA.forEach(p=>p.ts.forEach(t=>ids.push(t.id))); return ids;
}
function updateHeader(){
  const ids=allTaskIds(); const done=ids.filter(id=>state.done[id]).length;
  const pct=ids.length?Math.round(done*100/ids.length):0;
  $("#pct").textContent=pct+"%"; $("#barfill").style.width=pct+"%"; $("#counter").textContent=done+"/"+ids.length;
}

/* ------------------------------- render tabs ------------------------------- */
function taskRow(id,label,cat,url,note,proj){
  const d=state.done[id];
  let sub=`<span class="tcat">${cat}</span>`;
  if(url)sub+=`<a class="tlink" href="${url}" target="_blank" rel="noopener">↗ <span class="d">${domain(url)}</span></a>`;
  return `<div class="task ${d?"done":""}" data-done="${id}">
    <button class="cbx" aria-label="concluir" aria-pressed="${d?"true":"false"}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2l2.6 2.6L10 3" fill="none" stroke="#0E1B14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div><div class="tt">${label}</div>${note?`<div class="tnote">${note}</div>`:""}<div class="tsub">${sub}</div>${proj?`<span class="tproj">projeto de portfólio</span>`:""}</div>
  </div>`;
}

function renderAgenda(){
  const hoje=new Date();
  const dow=hoje.getDay();
  const ym=hoje.toISOString().slice(0,7);
  const mes=MESES.find(m=>m.ym===ym);
  const dataStr=hoje.toLocaleDateString("pt-BR");
  let h=`<p class="lead">Sua rotina viva. <b>Hoje é ${DIAS[dow]}, ${dataStr}.</b> Marque, adicione eventos, siga o ritmo.</p>`;
  h+=`<div class="today"><h3>Hoje · ${DIAS[dow]}</h3>`;
  if(mes)h+=`<div class="tnote">Mês ${mes.i} — ${mes.nome} · foco: ${mes.foco}</div>`;
  ROTINA_DIA.forEach(r=>h+=`<div class="rowitem"><span class="k">${r[0]}</span><span>${r[1]}</span></div>`);
  (ROTINA_SEM[dow]||[]).forEach(b=>h+=`<div class="rowitem"><span class="k">na semana</span><span>${b}</span></div>`);
  h+=`</div>`;

  h+=`<div class="eyebrow">Adicionar evento</div>
    <div class="addbar">
      <input type="date" id="evDate" value="${hoje.toISOString().slice(0,10)}">
      <select id="evCat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
      <input class="desc" id="evDesc" placeholder="descrição do evento">
      <button id="evAdd">Adicionar</button>
    </div>`;

  const evs=[...state.events].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  h+=`<div class="eyebrow">Seus eventos</div>`;
  if(!evs.length)h+=`<p class="tnote">Nenhum evento ainda. Adicione compromissos, provas, entregas.</p>`;
  else{h+=`<div class="card"><div class="cbody">`;
    evs.forEach(e=>{const d=state.done[e.id];
      h+=`<div class="ev"><span><button class="cbx" data-done="${e.id}" style="display:inline-grid;vertical-align:middle;margin-right:8px" aria-pressed="${d?"true":"false"}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2l2.6 2.6L10 3" fill="none" stroke="#0E1B14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span style="${d?"color:var(--faint);text-decoration:line-through":""}">${e.date?e.date.split("-").reverse().join("/"):""} · [${e.cat}] ${e.desc}</span></span><button class="del" data-del="${e.id}">excluir</button></div>`;
    });
    h+=`</div></div>`;}
  $("#tab-agenda").innerHTML=h;
  // color completed event checkboxes
  document.querySelectorAll('#tab-agenda .ev .cbx[aria-pressed="true"]').forEach(b=>{b.style.background="var(--pass)";b.style.borderColor="var(--pass)";b.querySelector('svg').style.opacity=1;});
}

function renderOKR(){
  let h=`<p class="lead">Cada mês tem um <b>objetivo</b> e key results com meta. Use +/− para atualizar. No fim do mês, o marco mostra o quanto você avançou.</p>`;
  MESES.forEach(m=>{
    const col=state.col["ok"+m.i];
    const tarefas=doneMes(m), tot=tasksMes(m).length;
    h+=`<div class="card ${col?"col":""}"><div class="chead" data-col="ok${m.i}">
      <div style="flex:1"><p class="ctitle">Mês ${m.i} · ${m.nome}</p>
      <div class="cmeta"><span class="pc">OKR ${pctMesOkr(m)}%</span><span>${tarefas}/${tot} tarefas</span><span>${m.foco}</span></div></div>
      <span class="chev">▾</span></div>
      <div class="cbody">
      <div class="tnote" style="margin:2px 0 10px"><b style="color:var(--gold)">Objetivo:</b> ${m.obj}</div>`;
    m.krs.forEach(k=>{const v=state.kr[k.id]||0,p=pctKR(k);
      h+=`<div class="kr"><div class="krtop"><span class="krd">${k.d}</span><span class="krv">${v}/${k.meta}${k.un?" "+k.un:""} · ${p}%</span></div>
        <div class="krbar"><i style="width:${p}%"></i></div>
        <div class="krctl"><button data-kr="${k.id}" data-step="-1">−</button><button data-kr="${k.id}" data-step="1">+</button><span class="krv" style="color:var(--faint)">passo 1${k.un==="%"?" (%)":""}</span></div></div>`;
    });
    h+=`<div class="eyebrow" style="margin:16px 0 8px">Tarefas do mês</div>`;
    m.tf.forEach(x=>h+=taskRow(x[0],x[1],x[2],"","",0));
    h+=`</div></div>`;
  });
  $("#tab-okr").innerHTML=h;
}

function renderTrilha(){
  let h=`<p class="lead">A trilha técnica como <b>pipeline de build</b>: do Python (Fase 00) ao marco dourado de certificação. Marque conforme entrega.</p>`;
  TRILHA.forEach(p=>{
    const done=p.ts.filter(t=>state.done[t.id]).length, tot=p.ts.length, pc=tot?Math.round(done*100/tot):0;
    const col=state.col["tr"+p.id];
    h+=`<div class="card ${p.cert?"cert":""} ${col?"col":""}"><div class="chead" data-col="tr${p.id}">
      <div style="flex:1"><p class="ctitle">${p.code} · ${p.title}</p>
      <div class="cmeta"><span class="pc">${pc}%</span><span>${done}/${tot}</span><span>⏱ ${p.est}</span></div></div>
      <span class="chev">▾</span></div><div class="cbody">`;
    p.ts.forEach(t=>h+=taskRow(t.id,t.t,"Trilha AI",t.u,t.note,t.proj));
    h+=`</div></div>`;
  });
  $("#tab-trilha").innerHTML=h;
}

function renderPainel(){
  let h=`<p class="lead"><b>Objetivo final:</b> base de Python sólida, 2–3 projetos de IA no ar, BI certificado (PL-300), inglês certificado, portfólio pronto e busca ativa.</p>`;
  h+=`<div class="eyebrow">OKR por mês</div><div class="card"><div class="cbody">`;
  let somaOkr=0;
  MESES.forEach(m=>{const p=pctMesOkr(m);somaOkr+=p;
    h+=`<div class="pl"><span class="nm">Mês ${m.i} ${m.nome.split("/")[0]}</span><span class="b"><i style="width:${p}%"></i></span><span class="v">${p}%</span></div>`;});
  h+=`</div></div>`;
  h+=`<div class="eyebrow">Trilha técnica por fase</div><div class="card"><div class="cbody">`;
  let dT=0,tT=0;
  TRILHA.forEach(p=>{const done=p.ts.filter(t=>state.done[t.id]).length,tot=p.ts.length,pc=tot?Math.round(done*100/tot):0;dT+=done;tT+=tot;
    h+=`<div class="pl"><span class="nm">${p.code} ${p.title.split(" ").slice(0,3).join(" ")}</span><span class="b"><i style="width:${pc}%"></i></span><span class="v">${pc}%</span></div>`;});
  h+=`</div></div>`;
  const okrMed=Math.round(somaOkr/MESES.length);
  const trPct=tT?Math.round(dT*100/tT):0;
  h+=`<div class="eyebrow">Resumo</div><div class="card"><div class="cbody">
    <div class="pl"><span class="nm">Média OKR</span><span class="b"><i style="width:${okrMed}%"></i></span><span class="v">${okrMed}%</span></div>
    <div class="pl"><span class="nm">Trilha técnica</span><span class="b"><i style="width:${trPct}%"></i></span><span class="v">${trPct}%</span></div>
  </div></div>`;
  if(okrMed>=100&&trPct>=100)h+=`<p class="lead" style="color:var(--gold)">🏁 Do 'não sei Python' ao AI Engineer certificável. Contemple.</p>`;
  $("#tab-painel").innerHTML=h;
}

function renderAll(){renderAgenda();renderOKR();renderTrilha();renderPainel();updateHeader();
  $("#warn").style.display=storageOk?"none":"block";
  if(!storageOk)$("#warn").textContent="⚠ Neste modo o navegador não está salvando. Publique no GitHub Pages ou abra o arquivo localmente — e use Exportar como backup.";
}

/* ------------------------------- eventos UI ------------------------------- */
document.addEventListener("click",e=>{
  const cb=e.target.closest("[data-done]");
  if(cb){const id=cb.dataset.done;state.done[id]=!state.done[id];persist();renderAll();return;}
  const col=e.target.closest("[data-col]");
  if(col){const k=col.dataset.col;state.col[k]=!state.col[k];persist();
    const card=col.closest(".card");if(card)card.classList.toggle("col",!!state.col[k]);return;}
  const kr=e.target.closest("[data-kr]");
  if(kr){const id=kr.dataset.kr,step=+kr.dataset.step;
    const meta=[...MESES.flatMap(m=>m.krs)].find(x=>x.id===id).meta;
    let v=(state.kr[id]||0)+step*(meta>10?5:1);
    v=Math.max(0,Math.min(meta,v));state.kr[id]=v;persist();renderOKR();renderPainel();return;}
  const del=e.target.closest("[data-del]");
  if(del){state.events=state.events.filter(x=>x.id!==del.dataset.del);persist();renderAgenda();return;}
  if(e.target.id==="evAdd"){
    const dt=$("#evDate").value,cat=$("#evCat").value,desc=$("#evDesc").value.trim();
    if(!desc){$("#evDesc").focus();return;}
    state.events.push({id:"ev"+Date.now(),date:dt,cat,desc});persist();renderAgenda();return;}
});
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]");if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.id==="tab-"+b.dataset.tab));
});
$("#btnExport").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download=`diario-progresso-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
});
$("#btnImport").addEventListener("click",()=>$("#fileImport").click());
$("#fileImport").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);state=Object.assign({done:{},kr:{},events:[],col:{}},d);
    state.done=state.done||{};state.kr=state.kr||{};state.events=state.events||[];state.col=state.col||{};
    persist();renderAll();}catch(err){alert("Arquivo inválido.");}};
  r.readAsText(f);e.target.value="";
});
$("#btnReset").addEventListener("click",()=>{
  if(confirm("Zerar todo o progresso? Exporte um backup antes se quiser guardar.")){
    state={done:{},kr:{},events:[],col:{}};persist();renderAll();}
});

/* ------------------------------- init ------------------------------- */
(async function init(){
  renderAll();
  if(syncOn){
    const remote=await pullRemote();
    if(remote){state=Object.assign({done:{},kr:{},events:[],col:{}},remote);
      state.done=state.done||{};state.kr=state.kr||{};state.events=state.events||[];state.col=state.col||{};
      saveLocal(state);renderAll();}
    else pushRemote();
  }
})();
</script>
</body>
